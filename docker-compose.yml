services:
  postgres:
    image: postgres:16.4
    container_name: crdt_results_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crdt
      POSTGRES_PASSWORD: crdt_dev_password
      POSTGRES_DB: crdt_benchmarks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crdt -d crdt_benchmarks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: